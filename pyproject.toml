[project]
name = "ai-foley-sfx-generator"
version = "0.6.2"
description = "Cinematic AI foley and SFX generator with a plugin-host architecture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-foley maintainers" }]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "librosa>=0.10",
  "torch>=2.2",
  "diffusers>=0.27",
  "watchdog>=4.0",
  "rich>=13.7",
  "pydantic>=2.6",
]

[project.scripts]
foley = "foley.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foley"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/foley/contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"